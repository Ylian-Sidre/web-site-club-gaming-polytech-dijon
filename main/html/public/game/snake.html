<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Snake Pro - Menu Intégré</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }

        #game-container {
            position: relative;
        }

        canvas {
            border: 5px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #000;
            display: block;
        }

        /* Fenêtre de Game Over au milieu */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 62, 80, 0.95);
            padding: 30px;
            border: 3px solid #2ecc71;
            text-align: center;
            display: none; /* Caché par défaut */
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            min-width: 200px;
        }

        h1 { margin-top: 0; margin-bottom: 10px; }

        /* Ton bouton stylé */
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .btn-back:hover {
            background-color: #ff6b81;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
        }

        /* Bouton rejouer */
        .btn-restart {
            background: #2ecc71;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-restart:hover { background: #27ae60; }
    </style>
</head>
<body>

    <h1>Score : <span id="score">0</span></h1>

    <div id="game-container">
        <canvas id="snakeGame" width="400" height="400"></canvas>
        
        <div id="menu">
            <h2 style="color: #2ecc71; margin-top: 0;">PERDU !</h2>
            <p>Score final : <span id="finalScore">0</span></p>
            <button class="btn-restart" onclick="resetGame()">REESSAYER</button>
        </div>
    </div>

    <a href="../index.html" class="btn-back">Il ne s'est rien passé</a>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const menu = document.getElementById("menu");
        const finalScoreElement = document.getElementById("finalScore");

        const box = 20;
        let score, snake, food, d, gameLoop;

        function init() {
            score = 0;
            scoreElement.innerHTML = score;
            snake = [{ x: 9 * box, y: 10 * box }];
            food = spawnFood();
            d = null;
            menu.style.display = "none";
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, 100);
        }

        function spawnFood() {
            return {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
        }

        document.addEventListener("keydown", direction);

        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function resetGame() {
            init();
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#2ecc71" : "#27ae60";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                food = spawnFood();
            } else {
                if(d) snake.pop(); 
            }

            let newHead = { x: snakeX, y: snakeY };

            if(d && (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake))) {
                clearInterval(gameLoop);
                finalScoreElement.innerText = score;
                menu.style.display = "block";
            }

            if(d) snake.unshift(newHead);
        }

        init();
    </script>
</body>
</html>
