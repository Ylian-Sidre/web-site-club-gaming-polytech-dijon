<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Esquive Mortelle - Pro</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; display: flex; justify-content: center; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #game-container { position: relative; }
        canvas { background: #000; border: 2px solid #333; cursor: none; }
        #menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 40px; text-align: center;
            border: 2px solid #ff4757; border-radius: 15px; display: none;
        }
        button { background: #ff4757; color: white; border: none; padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        button:hover { background: #ff6b81; transform: scale(1.05); }
        #score-ui { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; pointer-events: none; }
        a {
            display: inline-block; 
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #ff4757; 
            color: white;
            text-decoration: none; 
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3); 
        }

        a:hover {
            background-color: #ff6b81; 
            transform: translateY(-3px); 
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5); 
        }

        a:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-ui">Score: <span id="currentScore">0</span></div>
    <canvas id="survivalCanvas"></canvas>
    
    <div id="menu">
        <h1 style="color: #ff4757; margin-top: 0;">TOUCHÉ !</h1>
        <p>Tu as survécu pendant <span id="finalScore">0</span> points.</p>
        <button onclick="resetGame()">REESSAYER</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('survivalCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    
    canvas.width = 600; canvas.height = 400;
    let score = 0, gameActive = true, enemies = [];
    const player = { x: 300, y: 200, radius: 10 };

    canvas.addEventListener('mousemove', (e) => {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left;
        player.y = e.clientY - rect.top;
    });

    function spawnEnemy() {
        if (!gameActive) return;
        const radius = Math.random() * 15 + 5;
        let x = Math.random() < 0.5 ? -radius : canvas.width + radius;
        let y = Math.random() * canvas.height;
        const angle = Math.atan2(player.y - y, player.x - x);
        const speed = 2 + (score / 1000);
        enemies.push({ x, y, radius, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
        setTimeout(spawnEnemy, Math.max(100, 500 - score / 10));
    }

    function resetGame() {
        score = 0; enemies = []; gameActive = true;
        menu.style.display = 'none';
        spawnEnemy(); update();
    }

    function update() {
        if (!gameActive) return;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
        ctx.fillStyle = '#00d2ff'; ctx.fill();

        enemies.forEach((enemy, i) => {
            enemy.x += enemy.vx; enemy.y += enemy.vy;
            ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2);
            ctx.fillStyle = '#ff4757'; ctx.fill();

            if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
                gameActive = false;
                document.getElementById('finalScore').innerText = Math.floor(score);
                menu.style.display = 'block';
            }
        });
        score++;
        document.getElementById('currentScore').innerText = Math.floor(score);
        requestAnimationFrame(update);
    }
    spawnEnemy(); update();
</script>
    <a href="../index.html"> Il ne s'est rien passé </a>
</body>
</html>
